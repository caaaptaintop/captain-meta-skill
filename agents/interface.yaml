interface:
  display_name: "Captain Meta Skill"
  short_description: "Design and evolve reusable agent skills"
  default_prompt: "Use $captain-meta-skill to design, create, evaluate, or evolve the explicitly named Skill."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "agent-skills-source"
    claude: "agent-skills-source"
    generic: "agent-skills-source"
